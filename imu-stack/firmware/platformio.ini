; PlatformIO project config for the T-Watch 2020 IMU firmware.
;
; TTGO_TWatch_Library (LilyGoWatch.h) targets the older ESP32 Arduino core
; (2.0.x) and has not been updated for core 3.x (IDF5-based), which changed
; several low-level APIs the library relies on. The platform version below
; is pinned to a release that still ships arduino-esp32 core ~2.0.14 — do
; not bump it to "latest" without checking TTGO_TWatch_Library compatibility
; first.
;
; If `pio run` fails to fetch the "espressif32" platform package, Espressif's
; official PlatformIO registry entry has had availability issues since 2024;
; the community fork "pioarduino/platform-espressif32" is the usual fallback
; — swap the `platform =` line for a release URL from that repo if needed.

[platformio]
; twatch_imu_ble/twatch_imu_ble.ino stays where Arduino IDE expects it
; (folder name == sketch name); this just points PlatformIO at it too.
src_dir = twatch_imu_ble

[env:twatch2020]
platform = espressif32 @ 6.5.0
board = esp32dev
framework = arduino

monitor_speed = 115200
upload_speed = 921600

; Same hardware selection the .ino already sets via #define before its
; includes — repeated here as build flags for good measure.
build_flags =
    -DLILYGO_WATCH_2020_V1
    -DLILYGO_WATCH_HAS_BMA423
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue

; NimBLE-Arduino 2.x — the BLE server callbacks in twatch_imu_ble.ino
; (onConnect/onDisconnect/onMTUChange/onSubscribe/onWrite) use the
; NimBLEConnInfo& signatures introduced in 2.x. NimBLE-Arduino 1.4.x will
; fail to compile against this sketch ("marked override, but does not
; override").
lib_deps =
    https://github.com/Xinyuan-LilyGO/TTGO_TWatch_Library.git
    h2zero/NimBLE-Arduino @ ^2.0
