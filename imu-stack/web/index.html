<!doctype html>
<html lang="ru">

<head>
  <meta charset="utf-8" />
  <title>BodyNet — IMU Telemetry Dashboard</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    :root {
      --bg: #0b0d12;
      --surface: #13161e;
      --surface-2: #1a1e29;
      --surface-3: #222738;
      --border: #2a2f42;
      --border-active: #3d4460;
      --text: #d8dbe8;
      --text-dim: #717694;
      --text-muted: #4d5270;
      --accent: #5b6aef;
      --accent-dim: rgba(91, 106, 239, 0.12);
      --green: #2dd4a0;
      --green-dim: rgba(45, 212, 160, 0.12);
      --red: #ef5b5b;
      --red-dim: rgba(239, 91, 91, 0.1);
      --orange: #e6a23c;
      --channel-x: #ef5b5b;
      --channel-y: #2dd4a0;
      --channel-z: #5b9def;
      --mono: 'JetBrains Mono', 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
      --sans: 'Inter', system-ui, -apple-system, sans-serif;
      --radius: 8px;
      --radius-lg: 12px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: var(--sans);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    .app {
      max-width: 1600px;
      margin: 0 auto;
      padding: 20px 24px;
    }

    /* -------- Header -------- */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 16px;
      margin-bottom: 20px;
      border-bottom: 1px solid var(--border);
    }

    .logo {
      display: flex;
      align-items: baseline;
      gap: 10px;
    }

    .logo h1 {
      font-size: 16px;
      font-weight: 600;
      letter-spacing: -0.01em;
      color: var(--text);
    }

    .logo .tag {
      font-size: 11px;
      font-weight: 500;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      padding: 2px 8px;
      border: 1px solid var(--border);
      border-radius: 4px;
    }

    .header-meta {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .header-stat {
      font-size: 12px;
      color: var(--text-dim);
      font-family: var(--mono);
    }

    .header-stat strong {
      color: var(--text);
      font-weight: 500;
    }

    .ws-status {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 500;
      color: var(--text-dim);
      padding: 4px 12px;
      border-radius: 4px;
      border: 1px solid var(--border);
      background: var(--surface);
    }

    .ws-status .indicator {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--red);
      transition: background 0.3s;
    }

    .ws-status.connected .indicator {
      background: var(--green);
      box-shadow: 0 0 6px rgba(45, 212, 160, 0.4);
    }

    /* -------- Device grid -------- */
    .device-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
      margin-bottom: 20px;
    }

    .device-panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      overflow: hidden;
      transition: border-color 0.2s;
    }

    .device-panel.active {
      border-color: var(--border-active);
    }

    .device-panel.active .panel-header {
      border-bottom-color: var(--border-active);
    }

    /* -------- Panel header -------- */
    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px;
      border-bottom: 1px solid var(--border);
      background: var(--surface-2);
    }

    .panel-id {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .panel-id .dev-indicator {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--text-muted);
      transition: background 0.3s;
    }

    .device-panel.active .dev-indicator {
      background: var(--green);
      box-shadow: 0 0 6px rgba(45, 212, 160, 0.4);
    }

    .panel-id .dev-label {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      letter-spacing: 0.02em;
      cursor: pointer;
      border-bottom: 1px dashed var(--text-muted);
    }

    .panel-id .dev-sublabel {
      font-size: 11px;
      color: var(--text-muted);
      font-family: var(--mono);
    }

    .panel-metrics {
      display: flex;
      gap: 16px;
      align-items: center;
    }

    .panel-metric {
      text-align: right;
    }

    .panel-metric .pm-label {
      font-size: 10px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      line-height: 1;
    }

    .panel-metric .pm-value {
      font-size: 14px;
      font-weight: 600;
      font-family: var(--mono);
      font-variant-numeric: tabular-nums;
      color: var(--text);
      line-height: 1.4;
    }

    .panel-metric .pm-unit {
      font-size: 10px;
      font-weight: 400;
      color: var(--text-dim);
    }

    /* -------- Chart area -------- */
    .panel-body {
      padding: 12px 16px 8px;
    }

    .chart-labels {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 4px;
    }

    .chart-label-left {
      font-size: 11px;
      color: var(--text-dim);
      font-family: var(--mono);
    }

    .chart-legend {
      display: flex;
      gap: 12px;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 10px;
      font-family: var(--mono);
      color: var(--text-dim);
      cursor: pointer;
      user-select: none;
    }

    .legend-item .swatch {
      width: 10px;
      height: 3px;
      border-radius: 1px;
    }

    .legend-item.off {
      opacity: 0.35;
    }

    .chart-wrap {
      position: relative;
      height: 200px;
    }

    .chart-wrap canvas {
      width: 100% !important;
      height: 100% !important;
    }

    /* -------- Bottom stats row -------- */
    .panel-footer {
      display: flex;
      justify-content: space-between;
      padding: 6px 16px 10px;
      border-top: 1px solid var(--border);
    }

    .pf-item {
      font-size: 11px;
      color: var(--text-dim);
      font-family: var(--mono);
    }

    .pf-item strong {
      color: var(--text);
      font-weight: 500;
    }

    /* -------- Aggregate section -------- */
    .agg-section {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      overflow: hidden;
    }

    .agg-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px;
      background: var(--surface-2);
      border-bottom: 1px solid var(--border);
    }

    .agg-title {
      font-size: 13px;
      font-weight: 600;
    }

    .agg-controls {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .agg-select {
      background: var(--surface-3);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 12px;
      font-family: var(--mono);
      padding: 4px 10px;
      border-radius: 4px;
      cursor: pointer;
      outline: none;
    }

    .agg-select:focus {
      border-color: var(--accent);
    }

    .agg-body {
      padding: 12px 16px 16px;
    }

    .agg-chart-wrap {
      position: relative;
      height: 220px;
    }

    .agg-chart-wrap canvas {
      width: 100% !important;
      height: 100% !important;
    }

    .empty-state {
      text-align: center;
      padding: 32px 16px;
      color: var(--text-muted);
      font-size: 12px;
      font-family: var(--mono);
    }

    /* -------- Export section -------- */
    .export-section {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      overflow: hidden;
      margin-top: 20px;
    }

    .export-header {
      padding: 10px 16px;
      background: var(--surface-2);
      border-bottom: 1px solid var(--border);
      font-size: 13px;
      font-weight: 600;
    }

    .export-body {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-end;
      gap: 14px;
      padding: 16px;
    }

    .export-field {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .export-field label {
      font-size: 10px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .export-field input,
    .export-field select {
      background: var(--surface-3);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 12px;
      font-family: var(--mono);
      padding: 5px 10px;
      border-radius: 4px;
      outline: none;
    }

    .export-field input:focus,
    .export-field select:focus {
      border-color: var(--accent);
    }

    .export-devices {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      max-width: 320px;
    }

    .export-devices label {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      font-family: var(--mono);
      color: var(--text-dim);
      cursor: pointer;
      text-transform: none;
      letter-spacing: normal;
    }

    .export-btn {
      background: var(--accent);
      border: none;
      color: #fff;
      font-size: 12px;
      font-weight: 600;
      font-family: var(--sans);
      padding: 7px 16px;
      border-radius: 4px;
      cursor: pointer;
    }

    .export-btn:hover { filter: brightness(1.1); }
    .export-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .export-hint {
      font-size: 11px;
      color: var(--text-muted);
      padding: 0 16px 14px;
      font-family: var(--mono);
    }

    /* -------- Tooltip -------- */
    .tooltip {
      position: fixed;
      background: var(--surface-3);
      border: 1px solid var(--border-active);
      color: var(--text);
      font-size: 11px;
      font-family: var(--mono);
      padding: 6px 10px;
      border-radius: 4px;
      pointer-events: none;
      z-index: 100;
      white-space: nowrap;
      display: none;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
    }

    /* -------- Responsive -------- */
    @media (max-width: 1100px) {
      .device-grid { grid-template-columns: 1fr; }
    }

    @media (max-width: 640px) {
      .app { padding: 12px; }
      .device-grid { gap: 12px; }
      .chart-wrap { height: 160px; }
      header { flex-direction: column; gap: 10px; align-items: flex-start; }
      .panel-metrics { gap: 10px; }
    }
  </style>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
</head>

<body>
  <div class="app">
    <header>
      <div class="logo">
        <h1>BodyNet</h1>
        <span class="tag">IMU Telemetry</span>
      </div>
      <div class="header-meta">
        <span class="header-stat">Devices: <strong id="active-count">0</strong>/4</span>
        <span class="header-stat">Frames: <strong id="total-frames">0</strong></span>
        <div class="ws-status" id="ws-status">
          <div class="indicator"></div>
          <span id="ws-status-text">Disconnected</span>
        </div>
      </div>
    </header>

    <div class="device-grid" id="device-grid"></div>

    <div class="agg-section">
      <div class="agg-header">
        <span class="agg-title" id="agg-title">Aggregate Activity &mdash; Last Hour</span>
        <div class="agg-controls">
          <select class="agg-select" id="agg-resolution">
            <option value="10s">10 s</option>
            <option value="1m">1 min</option>
            <option value="5m">5 min</option>
            <option value="10m">10 min</option>
            <option value="15m">15 min</option>
            <option value="30m">30 min</option>
          </select>
          <select class="agg-select" id="hm-dev">
            <option value="" disabled selected>Select device…</option>
          </select>
        </div>
      </div>
      <div class="agg-body">
        <div class="agg-chart-wrap">
          <canvas id="agg-chart"></canvas>
        </div>
      </div>
    </div>

    <div class="export-section">
      <div class="export-header">Export to Excel</div>
      <div class="export-body">
        <div class="export-field">
          <label for="export-since">From</label>
          <input type="datetime-local" id="export-since" />
        </div>
        <div class="export-field">
          <label for="export-until">To</label>
          <input type="datetime-local" id="export-until" />
        </div>
        <div class="export-field">
          <label for="export-resolution">Resolution</label>
          <select id="export-resolution">
            <option value="1s">1 s (raw)</option>
            <option value="10s">10 s</option>
            <option value="1m" selected>1 min</option>
            <option value="5m">5 min</option>
            <option value="10m">10 min</option>
            <option value="15m">15 min</option>
            <option value="30m">30 min</option>
          </select>
        </div>
        <div class="export-field">
          <label>Devices</label>
          <div class="export-devices" id="export-devices">
            <span class="header-stat">no devices yet</span>
          </div>
        </div>
        <div class="export-field">
          <button class="export-btn" id="export-btn">Скачать .xlsx</button>
        </div>
      </div>
      <div class="export-hint">
        Файл содержит два листа &mdash; RMS_mG и Peak_mG: время в строках, по столбцу на устройство.
      </div>
    </div>
  </div>

  <div class="tooltip" id="tooltip"></div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
  <script src="./app.js"></script>
</body>

</html>
