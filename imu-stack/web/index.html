<!doctype html>
<html lang="ru">

<head>
    <meta charset="utf-8" />
    <title>IMU Live</title>
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <style>
        body {
            font-family: system-ui, sans-serif;
            margin: 16px;
        }

        .row {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
        }

        .card {
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 10px;
        }

        canvas {
            max-width: 100%;
            height: 320px;
        }

        .heatmap {
            display: grid;
            grid-template-columns: repeat(24, 1fr);
            gap: 2px;
        }

        .cell {
            height: 14px;
            background: #eee;
            border-radius: 3px;
        }
    </style>
</head>

<body>
    <h2>IMU Live</h2>
    <div class="row">
        <div class="card"><b>dev_id:</b> <span id="dev"></span></div>
        <div class="card"><b>seq:</b> <span id="seq"></span></div>
        <div class="card"><b>batt:</b> <span id="batt"></span>%</div>
        <div class="card"><b>|a| peak:</b> <span id="peak"></span> mG</div>
        <div class="card"><b>steps (win):</b> <span id="steps"></span></div>
    </div>

    <div class="card" style="margin-top:12px">
        <canvas id="chart"></canvas>
    </div>

    <h3>Активность за последний час (10s buckets)</h3>
    <div id="hm" class="heatmap"></div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script type="module" src="./app.js"></script>
</body>

</html>
